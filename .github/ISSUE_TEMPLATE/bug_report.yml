name: Bug Report
description: Informá un error o comportamiento inesperado
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: Resumen
      description: Breve descripción del error
      placeholder: "El endpoint /api/juegos devuelve 500"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Explicá cómo reproducir el error paso a paso
      placeholder: |
        1. Ejecutar `./mvnw spring-boot:run`
        2. Hacer GET a `/api/juegos`
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería pasar en lugar del error?
      placeholder: "Debería devolver la lista de juegos"

  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes (si hay)
      description: Pega el log del error, si aplica
      render: shell

  - type: input
    id: version
    attributes:
      label: Versión de la app
      description: Versión o commit donde ocurre
      placeholder: "v1.0.3, commit abcd123"
