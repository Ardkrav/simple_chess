name: Feature Request
description: Proponé una nueva funcionalidad
labels: [enhancement]
body:
  - type: input
    id: title
    attributes:
      label: Título de la funcionalidad
      placeholder: "Permitir exportar los datos a CSV"

  - type: textarea
    id: motivation
    attributes:
      label: ¿Por qué es útil?
      description: Contanos por qué sería útil esta mejora

  - type: textarea
    id: solution
    attributes:
      label: ¿Cómo podría implementarse?
      description: Ideas sobre cómo agregar la funcionalidad

  - type: checkboxes
    id: scope
    attributes:
      label: Ámbitos involucrados
      options:
        - label: Controlador (Controller)
        - label: Servicio (Service)
        - label: Repositorio (Repository)
        - label: Frontend (si aplica)
